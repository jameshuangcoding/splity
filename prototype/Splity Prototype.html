<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Splity · Prototype</title>
<link rel="stylesheet" href="splity-theme.css?v=6" />
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(120% 90% at 50% 0%, #1c2230 0%, #0a0c10 70%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
    overflow: hidden;
  }
  body.lightstage {
    background: radial-gradient(120% 90% at 50% 0%, #ffffff 0%, #dfe3ea 70%);
  }
  #stage { transform-origin: center center; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="splity-icons.jsx"></script>
<script type="text/babel" src="splity-data.jsx"></script>
<script type="text/babel" src="splity-ui.jsx"></script>
<script type="text/babel" src="splity-screens-1.jsx"></script>
<script type="text/babel" src="splity-screens-2.jsx?v=4"></script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const STEPS = [ScrHome, ScrReceipt, ScrPeople, ScrAssign, ScrSummary, ScrSend];

function App() {
  const [step, setStep] = useState(0);
  const [theme, setTheme] = useState('dark');
  const [name, setName] = useState(RECEIPT.name);
  const [assignments, setAssignments] = useState(() => ({ ...SEED_ASSIGN }));
  const [scale, setScale] = useState(1);

  const dark = theme === 'dark';
  useEffect(() => { document.body.classList.toggle('lightstage', !dark); }, [dark]);

  // fit device to viewport
  useEffect(() => {
    const fit = () => setScale(Math.min(1.05, (window.innerHeight - 36) / 874, (window.innerWidth - 28) / 402));
    fit(); window.addEventListener('resize', fit); return () => window.removeEventListener('resize', fit);
  }, []);

  const calc = useMemo(() => compute(RECEIPT, ITEMS, PEOPLE, assignments), [assignments]);

  const ctx = {
    name, setName, people: PEOPLE, assignments, setAssignments, calc,
    next: () => setStep(s => Math.min(STEPS.length - 1, s + 1)),
    back: () => setStep(s => Math.max(0, s - 1)),
    restart: () => setStep(0),
  };

  const Screen = STEPS[step];

  return (
    <div id="stage" style={{ transform: `scale(${scale})` }}>
      <IOSDevice dark={dark}>
        <div className="sp" data-theme={theme}>
          <TopBar step={step} total={STEPS.length} dark={dark}
            showBack={step > 0}
            onBack={ctx.back}
            onToggleTheme={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} />
          <div className="sp-top" />
          <Screen ctx={ctx} key={step} />
        </div>
      </IOSDevice>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
